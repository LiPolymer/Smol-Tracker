stages:
  - image
  - build

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        NCS_CACHE_POLICY: "pull"
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  ZEPHYR_SDK_VERSION: "0.16.9"
  BOARD: "nrf52840dk/nrf52840"
  ARTIFACT_NAME: "SlimeNRF_DIY_nRF52840_Tracker"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  WEST_WORKSPACE: "$CI_PROJECT_DIR/.west-workspace"
  NCS_CACHE_POLICY: "pull-push"
  CACHE_COMPRESSION_FORMAT: "tarzstd"
  CACHE_COMPRESSION_LEVEL: "fast"

build_ci_image:
  stage: image
  image: docker:27.5.1-cli
  services:
    - docker:27.5.1-dind

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

  script:
    - TOOLCHAIN_IMAGE="$CI_REGISTRY_IMAGE/ci:zephyr-${ZEPHYR_SDK_VERSION}"
    - docker pull "$TOOLCHAIN_IMAGE" || true
    - >-
      docker build
      --pull
      --cache-from "$TOOLCHAIN_IMAGE"
      --build-arg "ZEPHYR_SDK_VERSION=${ZEPHYR_SDK_VERSION}"
      -f ci/Dockerfile
      -t "$TOOLCHAIN_IMAGE"
      ci
    - docker push "$TOOLCHAIN_IMAGE"

  rules:
    # Publish the stable toolchain image automatically only after a Dockerfile
    # change lands on the default branch. In an MR it remains available as an
    # optional manual validation job, avoiding a rebuild after every MR push.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - ci/Dockerfile
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ci/Dockerfile
      when: manual
      allow_failure: true
    - when: never

build_firmware:
  stage: build
  image: "$CI_REGISTRY_IMAGE/ci:zephyr-0.16.9"
  timeout: 90m

  # Heavy NCS/Zephyr source dependencies are keyed by the west manifest instead
  # of the current branch. Keep the previous cache namespace while migrating the
  # SDK itself into the image so existing warm NCS caches remain reusable.
  cache:
    - key:
        files:
          - west.yml
        prefix: "smol-ncs-sdk-0.16.9"
      paths:
        - .west-workspace/.west/
        - .west-workspace/zephyr/
        - .west-workspace/nrf/
        - .west-workspace/modules/
        - .west-workspace/nrfxlib/
        - .west-workspace/bootloader/
        - .west-workspace/tools/
      policy: $NCS_CACHE_POLICY

    - key: "smol-pip-ubuntu24-py312"
      paths:
        - .cache/pip/
      policy: pull-push

  script:
    - |
      set -euo pipefail

      rm -rf "${WEST_WORKSPACE}/app"
      mkdir -p "${WEST_WORKSPACE}"
      git clone --quiet --no-hardlinks "$CI_PROJECT_DIR" "${WEST_WORKSPACE}/app"
      git -C "${WEST_WORKSPACE}/app" checkout --quiet "$CI_COMMIT_SHA"

      cd "${WEST_WORKSPACE}"
      if [ ! -d .west ]; then
        west init -l app
      fi

      west update --narrow -o=--depth=1
      west zephyr-export
      pip install -r zephyr/scripts/requirements.txt

      rm -rf app/build "$CI_PROJECT_DIR/artifacts"
      mkdir -p "$CI_PROJECT_DIR/artifacts"

      BUILD_STATUS=0
      west build \
        --board "$BOARD" \
        --pristine=always app \
        --build-dir app/build \
        -- \
        -DNCS_TOOLCHAIN_VERSION=NONE \
        -DBOARD_ROOT="$WEST_WORKSPACE/app" \
        || BUILD_STATUS=$?

      # Always collect useful diagnostics so failed board builds are inspectable.
      DTS_FILE=$(find app/build -name 'zephyr.dts' -type f | head -n 1 || true)
      CONFIG_FILE=$(find app/build -name '.config' -path '*/zephyr/*' -type f | head -n 1 || true)
      DT_HEADER=$(find app/build -name 'devicetree_generated.h' -type f | head -n 1 || true)

      [ -n "$DTS_FILE" ] && cp -v "$DTS_FILE" "$CI_PROJECT_DIR/artifacts/diag-zephyr.dts"
      [ -n "$CONFIG_FILE" ] && cp -v "$CONFIG_FILE" "$CI_PROJECT_DIR/artifacts/diag-dotconfig.txt"
      [ -n "$DT_HEADER" ] && cp -v "$DT_HEADER" "$CI_PROJECT_DIR/artifacts/diag-devicetree_generated.h"

      if [ "$BUILD_STATUS" -eq 0 ]; then
        HEX_FILE=$(find app/build -path '*/zephyr/zephyr.hex' -type f | head -n 1 || true)
        if [ -z "$HEX_FILE" ]; then
          echo "Build succeeded, but zephyr.hex was not found." >&2
          BUILD_STATUS=1
        else
          cp -v "$HEX_FILE" "$CI_PROJECT_DIR/artifacts/${ARTIFACT_NAME}.hex"
          sha256sum "$CI_PROJECT_DIR/artifacts/${ARTIFACT_NAME}.hex" | tee "$CI_PROJECT_DIR/artifacts/${ARTIFACT_NAME}.hex.sha256"
        fi
      fi

      echo "--- Collected artifacts ---"
      ls -la "$CI_PROJECT_DIR/artifacts" || true

      exit "$BUILD_STATUS"

  artifacts:
    name: "${ARTIFACT_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - artifacts/*
    expire_in: 30 days
    when: always
